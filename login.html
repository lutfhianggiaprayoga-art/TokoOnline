<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - Toko LUTFHI</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>


    <div class="login-container">

        <div class="login-box">

            <h1>
                TOKO LUTFHI
            </h1>


            <p>
                Silakan login terlebih dahulu
            </p>


            <form id="form-login">


                <!-- USERNAME -->

                <div class="input-group">

                    <label>
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        placeholder="Masukkan username"
                        required
                    >

                </div>



                <!-- PASSWORD -->

                <div class="input-group">

                    <label>
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Masukkan password"
                        required
                    >

                </div>



                <!-- BUTTON -->

                <button type="submit">
                    Login
                </button>


                <p id="pesan-login"></p>


            </form>

        </div>

    </div>


    <script src="login.js"></script>

</body>

</html>
